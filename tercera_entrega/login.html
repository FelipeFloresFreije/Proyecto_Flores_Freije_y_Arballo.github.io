<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
        rel="stylesheet"
    >
</head>

<body class="auth-body">

    <main>

        <section class="auth-card">

            <img src="assets/img/logo-batman.svg" alt="Logo" class="logo">

            <h2>Iniciar Sesión</h2>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Email:</label>

                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>

                    <input type="password" id="password" name="password" required>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="forgot-password" name="forgot-password">

                    <label for="forgot-password">¿Olvidaste tu contraseña?</label>
                </div>

                <button type="submit" class="btn btn-large btn-primary">Iniciar Sesión</button>

            </form>

            <div class="social-divider">
                <p>O continúa con</p>
            </div>

            <div class="social-buttons">

                <button type="button" aria-label="Twitter">
                    <a href="index.html"><img src="assets/icons/twitter.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="TikTok">
                    <a href="index.html"><img src="assets/icons/tiktok.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="Facebook">
                    <a href="index.html"><img src="assets/icons/facebook.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="Instagram">
                    <a href="index.html"><img src="assets/icons/instagram.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="Google">
                    <a href="index.html"><img src="assets/icons/google.svg" alt="" class="icons"></a>
                </button>

            </div>

            <div class="account-link">

                <p>¿No tienes cuenta?</p>

                <a href="registro.html">Crear cuenta.</a>

            </div>

        </section>

    </main>

    <script src="js/registro.js"></script>
</body>

</html>
