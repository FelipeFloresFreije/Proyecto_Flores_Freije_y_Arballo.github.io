<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Crear Cuenta</title>
 
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
 
    <!-- Fuente Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
 
<body class="auth-body">
 
    <main>
 
        <section class="auth-card">
 
            <img src="assets/img/logo-batman.svg" alt="Logo" class="logo">
 
            <h2>Crear Cuenta</h2>
 
            <form id="registerForm" novalidate>
 
                <div class="register-name">
 
                    <div class="form-group">
                        <label for="nombre">Nombre*:</label>
 
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
 
                    <div class="form-group">
                        <label for="apellido">Apellido*:</label>
 
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
 
                </div>
 
                <div class="form-group">
                    <label for="apodo">Apodo:</label>
 
                    <input type="text" id="apodo" name="apodo">
                </div>
 
                <div class="form-group">
                    <label for="email">Email*:</label>
 
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>
 
                <div class="form-group">
                    <label for="password">Contraseña*:</label>
 
                    <input type="password" id="password" name="password" required>
                </div>
 
                <div class="form-group">
                    <label for="password-repeat">Repetir Contraseña*:</label>
 
                    <input type="password" id="password-repeat" name="password-repeat" required>
                </div>
 
                <div class="checkbox-row">
                    <input type="checkbox" id="terms" name="terms" required>
 
                    <label for="terms">Acepto los Términos y Condiciones</label>
                </div>
 
                <button type="submit" class="btn btn-medium btn-primary">Crear Cuenta</button>
 
            </form>
 
            <div class="social-divider">
                <p>O continúa con</p>
            </div>
 
            <div class="social-buttons">

                <button type="button" aria-label="Twitter">
                    <a href="index.html"><img src="assets/icons/twitter.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="TikTok">
                    <a href="index.html"><img src="assets/icons/tiktok.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="Facebook">
                    <a href="index.html"><img src="assets/icons/facebook.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="Instagram">
                    <a href="index.html"><img src="assets/icons/instagram.svg" alt="" class="icons"></a>
                </button>

                <button type="button" aria-label="Google">
                    <a href="index.html"><img src="assets/icons/google.svg" alt="" class="icons"></a>
                </button>

            </div>
 
            <div class="account-link">
                <p>¿Ya tienes cuenta?</p>
 
                <a href="login.html">Iniciar Sesión.</a>
            </div>
 
        </section>

    </main>

    <div id="success-overlay" class="success-overlay">
        <div class="success-box">
            <svg viewBox="0 0 52 52" class="checkmark">
                <circle cx="26" cy="26" r="24" fill="none" class="check-circle"/>
                <path fill="none" d="M14 27l8 8 16-16" class="check-path"/>
            </svg>
            <h2>¡Cuenta creada!</h2>
            <p class="body">Redirigiendo al inicio de sesión...</p>
        </div>
    </div>

    <script src="js/registro.js"></script>
 
</body>

</html>
