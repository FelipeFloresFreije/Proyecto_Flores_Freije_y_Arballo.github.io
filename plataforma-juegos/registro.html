<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Fuente Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
        rel="stylesheet"
    >
</head>

<body class="auth-body">

    <main>

        <section class="auth-card register-card">

            <img src="assets/img/logo-batman.svg" alt="Logo" class="auth-logo">

            <h2>Crear Cuenta</h2>

            <form>

                <div class="register-name">

                    <div class="form-group">
                        <label for="nombre">Nombre*:</label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido*:</label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">

                    <label for="apodo">Apodo:</label>

                    <input
                        type="text"
                        id="apodo"
                        name="apodo"
                    >

                </div>

                <div class="form-group">

                    <label for="email">Email*:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">Contraseña*:</label>

                    <inputtype="password" id="password" name="password" required>

                </div>

                <div class="form-group">

                    <label for="password-repeat">Repetir Contraseña*:</label>

                    <input type="password" id="password-repeat" name="password-repeat" required>

                </div>

                <div class="register-terms">

                    <input type="checkbox" id="terms" name="terms" required>

                    <label for="terms"> ¿Acepto Terminos y Condiciones?</label>

                </div>

                <button type="submit" class="btn btn-medium btn-primary">Crear Cuenta</button>

            </form>

            <div class="social-divider">
                <p>O continúa con</p>
            </div>

            <div class="social-buttons">

                <button type="button">
                    <img src="assets/icons/twitter.svg" alt="Twitter" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/tiktok.svg" alt="TikTok" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/facebook.svg" alt="Facebook" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/instagram.svg" alt="Instagram" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/google.svg" alt="Google" class="icons">
                </button>

            </div>
            <div class="account-link">
                <p>¿Ya tienes cuenta?</p>
                <a href="login.html">Iniciar Sesión</a>
            </div>

        </section>

    </main>

</body>

</html>
