<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
        rel="stylesheet"
    >
</head>

<body class="auth-body">

    <main>

        <section class="auth-card">

            <img src="assets/img/logo-batman.svg" alt="Logo" class="auth-logo">

            <h2>Iniciar Sesión</h2>

            <form>

                <div class="form-group">
                    <label for="email">Email:</label>

                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                </div>

                <div class="login-options">
                    <input type="checkbox" id="forgot-password" name="forgot-password">

                    <label for="forgot-password">¿Olvidaste tu contraseña?</label>
                </div>

                <button type="submit" class="btn btn-large btn-primary">Iniciar Sesión</button>

            </form>

            <div class="social-divider">
                <p>O continúa con</p>
            </div>

            <div>
            <div class="social-buttons">

                <button type="button">
                    <img src="assets/icons/twitter.svg" alt="Twitter" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/tiktok.svg" alt="TikTok" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/facebook.svg" alt="Facebook" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/instagram.svg" alt="Instagram" class="icons">
                </button>

                <button type="button">
                    <img src="assets/icons/google.svg" alt="Google" class="icons">
                </button>

            </div>

            </div>

            <!-- Crear cuenta -->
            <div>

                <p>¿No tienes cuenta?</p>

                <a href="registro.html">
                    Crear cuenta.
                </a>

            </div>

        </section>

    </main>

</body>

</html>
